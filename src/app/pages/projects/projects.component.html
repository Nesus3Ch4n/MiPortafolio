<div class="projects-page">
    <div class="container">
      <div class="page-header">
        <h1>Mis Proyectos</h1>
        <p class="subtitle">Aquí puedes ver algunos de mis trabajos recientes y destacados</p>
      </div>
      
      <div class="projects-grid">
        <div class="project-card" *ngFor="let project of projects">
          <div class="project-image">
            <div class="image-placeholder">{{project.image}}</div>
          </div>
          <div class="project-content">
            <h3>{{project.title}}</h3>
            <p>{{project.description}}</p>
            
            <div class="tech-tags">
              <span class="tag" *ngFor="let tech of project.technologies">
                {{tech}}
              </span>
            </div>
            
            <div class="project-links">
              <a [href]="project.liveUrl" class="link-btn" target="_blank">
                Ver Demo
              </a>
              <a [href]="project.githubUrl" class="link-btn secondary" target="_blank">
                GitHub
              </a>
            </div>
          </div>
        </div>
      </div>
      
      <div class="more-info">
        <p>¿Interesado en ver más proyectos? <a routerLink="/contacto">Contáctame</a> para conocer todos mis trabajos.</p>
      </div>
    </div>
  </div>
